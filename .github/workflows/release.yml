name: release

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags are needed to compute the version
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: make install
      - run: make check
      - run: make api-check
      - run: make build
      - name: Store distribution
        uses: actions/upload-artifact@v4
        with:
          name: koala-dist
          path: dist/

  debian:
    name: Build Debian package
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: koala-dist
          path: dist/
      - run: sudo apt-get update && sudo apt-get -y install debhelper
      - run: make release
      - run: make deb
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ../*.deb
            kowabunga-koala-*.tgz

  publish:
    name: Trigger packages publishing
    needs: debian
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APT repository update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: '${{ secrets.PAT_PACKAGES_WORKFLOW_TOKEN }}'
          repository: kowabunga-cloud/packages
          event-type: Publish-Deb
