name: release

on:
  push:
    branches: [master]
  pull_request:
  # releases are created by semantic-release, whose release commit carries
  # [skip ci], so that its tag push doesn't trigger workflows
  release:
    types: [published]

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to compute the version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: make install
      - run: make check
      - run: make api-check
      - run: make build
      - name: Store distribution
        uses: actions/upload-artifact@v7
        with:
          name: koala-dist
          path: dist/

  # container image build and vulnerability scan, published on release
  image:
    name: Container image
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: kowabunga-cloud/workflows/.github/workflows/container.yml@v1
    with:
      image: koala
      description: Kowabunga Koala web UI
      # releases are tagged x.y.z
      version: ${{ github.event_name == 'release' && github.ref_name || '' }}

  debian:
    name: Build Debian package
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: koala-dist
          path: dist/
      - run: sudo apt-get update && sudo apt-get -y install debhelper
      - run: make release
      - run: make deb
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ../*.deb
            kowabunga-koala-*.tgz

  publish:
    name: Trigger packages publishing
    needs: debian
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger APT repository update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: '${{ secrets.PAT_PACKAGES_WORKFLOW_TOKEN }}'
          repository: kowabunga-cloud/packages
          event-type: Publish-Deb
