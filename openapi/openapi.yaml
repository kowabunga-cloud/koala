      explode: false
      in: path
      name: agentId
      required: true
      schema:
        type: string
      style: simple
    RecordID:
      description: The ID of the DNS record.
      explode: false
      in: path
      name: recordId
      required: true
      schema:
        type: string
      style: simple
    InstanceID:
      description: The ID of the virtual machine instance.
      explode: false
      in: path
      name: instanceId
      required: true
      schema:
        type: string
      style: simple
    KaktusID:
      description: The ID of the Kaktus computing node.
      explode: false
      in: path
      name: kaktusId
      required: true
      schema:
        type: string
      style: simple
    KawaiiID:
      description: The ID of the Kawaii.
      explode: false
      in: path
      name: kawaiiId
      required: true
      schema:
        type: string
      style: simple
    KawaiiIpSecID:
      description: The ID of the Kawaii IPsec connection.
      explode: false
      in: path
      name: kawaiiIpSecId
      required: true
      schema:
        type: string
      style: simple
    KiwiID:
      description: The ID of the Kiwi (Kowabunga Inner Wan Interface) provides edge-network
        services..
      explode: false
      in: path
      name: kiwiId
      required: true
      schema:
        type: string
      style: simple
    KomputeID:
      description: The ID of the Kompute.
      explode: false
      in: path
      name: komputeId
      required: true
      schema:
        type: string
      style: simple
    OptionalQueryKomputePublic:
      description: Whether the Kompute should be exposed over public Internet (a public
        IPv4 address will then be auto-assigned).
      explode: true
      in: query
      name: public
      required: false
      schema:
        default: false
        type: boolean
      style: form
    KonveyID:
      description: The ID of the Konvey (Kowabunga Network Load-Balancer).
      explode: false
      in: path
      name: konveyId
      required: true
      schema:
        type: string
      style: simple
    KwarantineID:
      description: The ID of the Kwarantine.
      explode: false
      in: path
      name: kwarantineId
      required: true
      schema:
        type: string
      style: simple
    KyloID:
      description: The ID of the Kylo.
      explode: false
      in: path
      name: kyloId
      required: true
      schema:
        type: string
      style: simple
    ProjectID:
      description: The ID of the project.
      explode: false
      in: path
      name: projectId
      required: true
      schema:
        type: string
      style: simple
    RegionID:
      description: The ID of the region.
      explode: false
      in: path
      name: regionId
      required: true
      schema:
        type: string
      style: simple
    NfsID:
      description: The ID of the NFS storage.
      explode: false
      in: path
      name: nfsId
      required: true
      schema:
        type: string
      style: simple
    OptionalQueryNfsID:
      description: "NFS storage ID (optional, region's default if unspecified)."
      explode: true
      in: query
      name: nfsId
      required: false
      schema:
        type: string
      style: form
    PoolID:
      description: The ID of the storage pool.
      explode: false
      in: path
      name: poolId
      required: true
      schema:
        type: string
      style: simple
    OptionalQueryPoolID:
      description: "Storage pool ID (optional, region's default if unspecified)."
      explode: true
      in: query
      name: poolId
      required: false
      schema:
        type: string
      style: form
    SubnetID:
      description: The ID of the network subnet.
      explode: false
      in: path
      name: subnetId
      required: true
      schema:
        type: string
      style: simple
    OptionalQueryAssignIP:
      description: Whether Kowabunga should pick and assign an IP address to this
