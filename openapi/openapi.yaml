      explode: true
      in: query
      name: subnetSize
      required: false
      schema:
        default: 26
        format: int32
        maximum: 30
        minimum: 8
        type: integer
      style: form
    TeamID:
      description: The ID of the Kowabunga users team.
      explode: false
      in: path
      name: teamId
      required: true
