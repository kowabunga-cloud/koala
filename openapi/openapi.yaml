    KMotionPlanRequest:
      description: A virtual machine instance kMotion plan request.
      properties:
        destination:
          default: auto
          description: "How the destination Kaktus computing node must be elected.\
            \ Use \"manual\" to explicitly target a given node (see kaktus), \"zone\"\
            \ to automatically elect the least busy node within the instance own availability\
            \ zone, \"region\" to automatically elect the least busy node anywhere\
            \ within the instance region, or \"auto\" to let Kowabunga fully decide\
            \ the best possible destination across the region, regardless of the number\
            \ of availability zones it contains."
