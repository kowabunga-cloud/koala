        kmotion_enabled:
          description: "Whether kMotion (live/cold host migration) is enabled for\
            \ the Kompute. When disabled, the instance remains bound to its original\
            \ hosting node."
          type: boolean
    Konvey:
      description: A Kowabunga Konvey is a layer-4 network load-balancer used to distribute
        service requests to associated backend instances.
      properties:
        id:
          description: The Konvey (Kowabunga Network Load-Balancer) ID (auto-generated)
            (read-only).
          readOnly: true
