          items:
            type: string
          type: array
        maintenance:
          description: Whether the Kaktus node is under maintenance. A node under
            maintenance keeps running its existing instances but is excluded from
            scheduling of newly created workloads. Use the maintenance enable/disable
            operations to change it (read-only).
          readOnly: true
