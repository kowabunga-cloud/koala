      style: simple
    OptionalQueryExpire:
      description: Whether or not the token should expire.
      explode: true
      in: query
      name: expire
      required: false
      schema:
        default: false
        type: boolean
      style: form
    OptionalQueryExpirationDate:
      description: Token's expiration date (YYYY-MM-DD format).
      explode: true
      in: query
      name: expirationDate
      required: false
      schema:
        format: date
        type: string
      style: form
    UserID:
