    Kompute:
      description: "A Kompute is a wrapper object for bare virtual machines. It consists\
        \ of an instance, one to several attached volumes and 2 network adapters (a\
        \ private one, a public one). This is the prefered way for creating virtual\
        \ machines. IP addresses will be automatically assigned."
      properties:
        id:
          description: The Kompute ID (auto-generated) (read-only).
          readOnly: true
          type: string
        name:
          description: The Kompute name.
          type: string
        description:
          description: The Kompute description.
          type: string
        memory:
          description: The Kompute memory size (in bytes).
          format: int64
          minimum: 1
          type: integer
        vcpus:
          description: The Kompute number of vCPUs.
          format: int32
          minimum: 1
          type: integer
        disk:
          description: The Kompute OS disk size (in bytes).
          format: int64
          minimum: 1
          type: integer
        data_disk:
          default: 0
          description: "The Kompute extra data disk size (in bytes). If unspecified,\
            \ no extra data disk will be assigned."
          format: int64
          minimum: 0
          type: integer
        ip:
          description: The Kompute assigned private IPv4 address (read-only).
          readOnly: true
          type: string
        kwarantines:
          description: "An optional list of existing Kwarantine anti-affinity group\
            \ IDs. Only considered at Kompute creation time, to elect an initial host\
            \ consistent with the referenced groups policies and register the Kompute\
            \ as one of their members. Read-only afterwards, always reflecting current\
            \ membership, which should be managed going forward via the Kwarantine\
            \ webservices. Can only be set at creation time, ignored on updates."
          items:
            type: string
          type: array
          x-immutable: true
        uefi:
          default: true
          description: "Enable UEFI secure firmware (vs. legacy BIOS). Can only be\
            \ set at creation time, ignored on updates."
          type: boolean
          x-immutable: true
        kmotion_enabled:
          default: true
          description: "Whether kMotion (live/cold host migration) is enabled for\
            \ the Kompute. When disabled, the instance remains bound to its original\
            \ hosting node."
          type: boolean
      required:
      - disk
      - memory
      - name
      - vcpus
    KomputeUpdate:
      description: A Kompute update (unspecified properties are left unchanged).
      properties:
        name:
          description: The Kompute name.
          type: string
