    Kwarantine:
      description: "A Kwarantine is an anti-affinity mechanism that ensures its member\
        \ virtual machine instances or Kompute resources are never co-scheduled on\
        \ the same Kaktus computing node (host policy) or the same availability zone\
        \ (zone policy), regardless of Kaktus host scheduling score, so that critical\
        \ redundant resources stay properly spread out."
      properties:
        id:
          description: The Kwarantine ID (auto-generated) (read-only).
          readOnly: true
          type: string
        name:
          description: The Kwarantine name.
          type: string
        description:
          description: The Kwarantine description.
          type: string
        policy:
          default: host
          description: "The anti-affinity enforcement policy. Use \"host\" to guarantee\
            \ no two group members are ever scheduled on the same Kaktus computing\
            \ node, or \"zone\" to guarantee no two group members are ever scheduled\
            \ within the same availability zone."
          enum:
          - host
          - zone
          type: string
        instances:
          description: "A list of existing virtual machine instance IDs that are part\
            \ of the Kwarantine group. Members are guaranteed to never be co-scheduled\
            \ according to the group policy, regardless of Kaktus host scheduling\
            \ score. Managed through the dedicated add/remove operations (read-only)."
          items:
            type: string
          readOnly: true
          type: array
        komputes:
          description: "A list of existing Kompute IDs that are part of the Kwarantine\
            \ group. Members are guaranteed to never be co-scheduled according to\
            \ the group policy, regardless of Kaktus host scheduling score. Managed\
            \ through the dedicated add/remove operations (read-only)."
          items:
            type: string
          readOnly: true
          type: array
      required:
      - name
    KwarantineUpdate:
      description: A Kwarantine update (unspecified properties are left unchanged).
      properties:
        name:
          description: The Kwarantine name.
          type: string
        description:
          description: The Kwarantine description.
          type: string
        policy:
          description: "The anti-affinity enforcement policy. Use \"host\" to guarantee\
            \ no two group members are ever scheduled on the same Kaktus computing\
            \ node, or \"zone\" to guarantee no two group members are ever scheduled\
            \ within the same availability zone."
          enum:
          - host
          - zone
          type: string
    Kylo:
      description: A Kylo provides an elastic NFS-like remote storage volume.
      properties:
